name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app_v2

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app_v2/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 前端测试 (vitest)
        run: npx vitest run

      # Tauri 的 generate_context! 宏在编译期需要 frontendDist(../dist) 存在，
      # 因此 cargo test 之前必须先产出前端构建
      - name: 构建前端产物 (dist)
        run: npx vite build

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app_v2/src-tauri

      - name: Rust 测试 (cargo test)
        run: cargo test
        working-directory: app_v2/src-tauri
