<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Shadow -->
    <filter id="squircle-shadow-b" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Deep Midnight Slate Base -->
    <linearGradient id="bg-grad-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="60%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#06070A"/>
    </linearGradient>

    <!-- Inner Border Glow -->
    <linearGradient id="border-glow-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Source Language Bubble Gradient (Cobalt / Cyan Glass) -->
    <linearGradient id="bubble-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Target Language Bubble Gradient (Amber / Coral Glass) -->
    <linearGradient id="bubble-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Intersection / Bridge Highlight -->
    <linearGradient id="bridge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="soft-glow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Base Plate -->
  <rect x="36" y="36" width="440" height="440" rx="98" ry="98"
        fill="url(#bg-grad-b)" filter="url(#squircle-shadow-b)"/>
  <rect x="36.5" y="36.5" width="439" height="439" rx="97.5" ry="97.5"
        fill="none" stroke="url(#border-glow-b)" stroke-width="1.5"/>

  <!-- 2. Ambient Atmosphere Glow -->
  <circle cx="210" cy="240" r="110" fill="#38BDF8" opacity="0.12" filter="url(#soft-glow-b)"/>
  <circle cx="300" cy="280" r="110" fill="#FB923C" opacity="0.12" filter="url(#soft-glow-b)"/>

  <!-- 3. Source Bubble with Cat Left Ear -->
  <path d="M 160 330
           C 120 330 110 270 125 210
           C 135 170 155 140 170 115
           C 174 108 180 110 184 118
           C 195 140 215 175 250 190
           C 290 205 300 250 280 290
           C 260 330 200 330 160 330 Z"
        fill="url(#bubble-blue)"
        stroke="rgba(255,255,255,0.3)"
        stroke-width="1.5"/>

  <!-- 4. Target Bubble with Cat Right Ear (Overlapping) -->
  <path d="M 350 350
           C 390 350 400 290 385 230
           C 375 190 355 160 340 135
           C 336 128 330 130 326 138
           C 315 160 295 195 260 210
           C 220 225 210 270 230 310
           C 250 350 310 350 350 350 Z"
        fill="url(#bubble-orange)"
        stroke="rgba(255,255,255,0.3)"
        stroke-width="1.5"
        style="mix-blend-mode: screen;"/>

  <!-- 5. Central Cat Head Formed by Overlap with Precision Glyph "A" / "文" -->
  <!-- Sleek Cat Face Line Accent -->
  <circle cx="256" cy="265" r="52" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" opacity="0.9"/>
  <!-- Left Eye: Cyan Glint -->
  <ellipse cx="238" cy="256" rx="5" ry="9" fill="#E0F2FE" transform="rotate(-8 238 256)"/>
  <!-- Right Eye: Amber Glint -->
  <ellipse cx="274" cy="256" rx="5" ry="9" fill="#FEF3C7" transform="rotate(8 274 256)"/>
  <!-- Cat Nose -->
  <polygon points="256,274 252,268 260,268" fill="#FFFFFF" opacity="0.95"/>
  <!-- Smile -->
  <path d="M 252 278 Q 256 282 260 278" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- 6. Bottom Floating Language Accent Dots -->
  <circle cx="220" cy="385" r="4" fill="#38BDF8" opacity="0.8"/>
  <circle cx="256" cy="392" r="5" fill="#A855F7" opacity="0.9"/>
  <circle cx="292" cy="385" r="4" fill="#FB923C" opacity="0.8"/>
</svg>
