[package]
name = "MaobuTranslator"
version = "0.3.1"
description = "猫步翻译"
authors = ["maobukeai"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_v2_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "MaobuTranslator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-winres = "0.3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "wry", "custom-protocol", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
md5 = "0.7"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "directml", "ndarray", "std", "tls-rustls"] }
ndarray = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false



